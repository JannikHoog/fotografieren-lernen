<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lichtfängerin · Fotografieren lernen</title>
<meta name="description" content="Spielerisch fotografieren lernen: Blende, Belichtungszeit und ISO verstehen – mit interaktivem Simulator für die Fujifilm X-T30 II.">
<meta name="theme-color" content="#FBF6F0">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="topbar">
  <a class="brand" href="#/">
    <span class="brand-mark" aria-hidden="true"></span>
    <span class="brand-text">Lichtfängerin</span>
  </a>
  <div class="topbar-right">
    <div class="xp-chip" id="xpChip" title="Deine Erfahrungspunkte">
      <span class="xp-ring" id="xpRing"></span>
      <span class="xp-meta">
        <b id="xpLevel">Level 1</b>
        <small id="xpPoints">0 XP</small>
      </span>
    </div>
  </div>
</header>

<nav class="mainnav" id="mainnav">
  <a href="#/" data-route="/" data-ico="lernen"><span>Lernen</span></a>
  <a href="#/uebung" data-route="/uebung" data-ico="ueben"><span>Üben</span></a>
  <a href="#/missionen" data-route="/missionen" data-ico="missionen"><span>Missionen</span></a>
  <a href="#/erfolge" data-route="/erfolge" data-ico="erfolge"><span>Erfolge</span></a>
</nav>

<main id="view" class="view" tabindex="-1"></main>

<footer class="foot">
  <p>Zum Fotografieren-Lernen gebaut · <a href="#/erfolge">Fortschritt</a> wird nur in deinem Browser gespeichert.</p>
</footer>

<!-- Belohnungs-Overlay -->
<div class="reward" id="reward" hidden>
  <div class="reward-card" role="alertdialog" aria-live="assertive">
    <div class="reward-media" id="rewardMedia"></div>
    <h3 id="rewardTitle">Stark!</h3>
    <p id="rewardText"></p>
    <button class="btn btn-primary" id="rewardClose">Weiter</button>
  </div>
</div>
<div class="confetti-layer" id="confetti" aria-hidden="true"></div>
<div class="toast-wrap" id="toasts" aria-live="polite"></div>

<script src="js/icons.js"></script>
<script src="js/gifs.js"></script>
<script src="js/state.js"></script>
<script src="js/reward.js"></script>
<script src="js/sim.js"></script>
<script src="js/lessons.js"></script>
<script src="js/app.js"></script>
</body>
</html>
